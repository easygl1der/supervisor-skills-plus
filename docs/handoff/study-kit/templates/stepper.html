<p class="lead">档案先读后写；复述有偏差时<b>回到纠正</b>再复述，最多两轮。</p>

<ol class="ve-capsrc"><li>开始：读 study-vault 的知识档案，查这个概念的前置是否已记录。</li><li>缺记录就弹一道选择题问熟练度；然后用大白话讲原理和 motivation（配场景图）。</li><li>把新概念挂到你已懂的概念上，画结构图。</li><li>你用自己的话复述，并说出联想到了什么。</li><li>按「机制 / 条件 / 边界」三层诊断，给出逐层比例。</li><li>从缺的那层、顺着你的联想纠正，重画图后<b>再复述一次</b>（最多两轮）。</li><li>通过 → 写会话记录、概念笔记、熟练度，自动 commit + push。</li></ol>
