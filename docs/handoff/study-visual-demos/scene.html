<html><body style="margin:0;font-family:'Noto Sans CJK SC',sans-serif;background:#fffaf0">
<svg width="1000" height="560" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#444"/></marker></defs>
<text x="500" y="45" font-size="30" text-anchor="middle" font-weight="bold">为什么"喝咖啡的人更长寿"可能是假象？</text>
<g><rect x="380" y="80" width="240" height="140" rx="20" fill="#ffe9a8" stroke="#c99a00" stroke-width="3"/>
<text x="500" y="145" font-size="56" text-anchor="middle">💰🏃</text><text x="500" y="195" font-size="22" text-anchor="middle">收入高 · 生活习惯好</text></g>
<g><rect x="60" y="340" width="240" height="150" rx="20" fill="#d6ecff" stroke="#2b7bd0" stroke-width="3"/>
<text x="180" y="410" font-size="60" text-anchor="middle">☕</text><text x="180" y="465" font-size="22" text-anchor="middle">每天喝精品咖啡</text></g>
<g><rect x="700" y="340" width="240" height="150" rx="20" fill="#d9f5d9" stroke="#2f9e44" stroke-width="3"/>

<line x1="400" y1="220" x2="240" y2="335" stroke="#444" stroke-width="4" marker-end="url(#a)"/>
<text x="210" y="270" font-size="19">买得起、有闲情</text>
<line x1="600" y1="220" x2="760" y2="335" stroke="#444" stroke-width="4" marker-end="url(#a)"/>
<text x="690" y="270" font-size="19">体检多、吃得好</text>
<line x1="305" y1="415" x2="690" y2="415" stroke="#e03131" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#a)"/>
<text x="500" y="400" font-size="22" text-anchor="middle" fill="#e03131">看到的相关 ≠ 因果 ❓</text>
<text x="500" y="530" font-size="20" text-anchor="middle" fill="#555">后门路径：咖啡 ← 收入 → 长寿；控制"收入"后，相关性消失</text>
