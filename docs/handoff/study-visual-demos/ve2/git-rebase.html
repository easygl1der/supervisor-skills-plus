<title>git rebase</title></head><body><main id="fig">
<svg width="0" height="0" style="position:absolute"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs></svg>
<div class="kicker">编程 · GIT 工作流</div><h1>rebase 把你的提交“搬”到 main 的最新端</h1>
<p class="lead">提交 C、D 不是被移动，而是<b>以新 hash 重放</b>成 C′、D′；旧提交只是没人指向了。</p>
<figure class="ve-steps" data-steps="5"><div class="frame"><svg viewBox="0 0 900 300" role="img" aria-label="git rebase 分步图">
<text class="sub" x="20" y="96">main</text><text class="sub" x="20" y="226">feature</text>
<path class="e" d="M110 90H178"/><path class="e" d="M220 90H288"/>
<path class="e" data-s="2" d="M330 90H398"/>
<path class="e" d="M210 110L285 200" data-s="1" /><path class="e" d="M330 220H398" data-s="1"/>
<g data-s="1"><circle class="sh" cx="310" cy="220" r="20"/><text x="310" y="225" text-anchor="middle" class="mono">C</text><circle class="sh" cx="420" cy="220" r="20"/><text x="420" y="225" text-anchor="middle" class="mono">D</text></g>
<circle class="sh" cx="90" cy="90" r="20"/><text x="90" y="95" text-anchor="middle" class="mono">A</text>
<circle class="sh" cx="200" cy="90" r="20"/><text x="200" y="95" text-anchor="middle" class="mono">B</text>
<circle class="sh" cx="310" cy="90" r="20"/><text x="310" y="95" text-anchor="middle" class="mono">E</text>
<g data-s="2"><circle class="sh" cx="420" cy="90" r="20"/><text x="420" y="95" text-anchor="middle" class="mono">F</text><text class="el" x="400" y="55">别人推到 main</text></g>
<g data-s="3 3"><path class="e hot" d="M440 90H508"/><circle class="sh key" cx="530" cy="90" r="20"/><text x="530" y="95" text-anchor="middle" class="mono">C′</text><path class="e async" d="M330 210 C 420 160, 460 130, 515 105"/><text class="el" x="560" y="140">重放 C 的改动</text></g>
<g data-s="4 4"><path class="e hot" d="M550 90H618"/><circle class="sh key" cx="640" cy="90" r="20"/><text x="640" y="95" text-anchor="middle" class="mono">D′</text></g>
<g data-s="5"><rect x="700" y="72" width="110" height="36" rx="4" class="sh key"/><text x="755" y="96" text-anchor="middle" class="mono">feature</text><path class="e hot" d="M700 90H662"/>
<g opacity=".35"><text class="el" x="460" y="270">C、D 无引用 → 之后被 gc（reflog 仍可找回）</text></g></g>
<g data-only="1"><rect x="460" y="202" width="100" height="36" rx="4" class="sh key"/><text x="510" y="226" text-anchor="middle" class="mono">feature</text><path class="e" d="M460 220H442"/></g>
</svg></div>
<ol class="ve-capsrc"><li>从 B 拉出 <b>feature</b> 分支，提交了 C、D。</li><li>与此同时 main 前进到 E、F。直接 merge 会多一个合并提交。</li><li><code>git rebase main</code>：把 C 的 diff 应用到 F 上，生成<b>新提交 C′</b>（hash 不同）。</li><li>同样重放 D → <b>D′</b>。冲突会在这一步停下让你解决。</li><li>feature 指针移到 D′，历史变成一条直线。<b>已推送的分支别 rebase</b>（会改写别人依赖的 hash）。</li></ol>
<figcaption><span class="fign">图 1</span> rebase = 逐个重放提交 + 移动分支指针。</figcaption></figure>
