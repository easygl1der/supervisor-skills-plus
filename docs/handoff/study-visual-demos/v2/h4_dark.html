<html><head><meta charset=utf-8><style>body{margin:0;width:1200px;height:680px;background:#0f172a;color:#e2e8f0;font-family:'Noto Sans CJK SC'}
h1{margin:28px 40px 4px;font-size:34px}h1 span{color:#38bdf8}.sub{margin:0 40px;color:#94a3b8}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin:30px 40px}.k{background:#1e293b;border-radius:16px;padding:22px;border:1px solid #334155}
.big{font-size:48px;font-weight:800}.l{color:#94a3b8;font-size:16px}.bar{height:16px;border-radius:8px;margin:8px 0}
.flow{margin:10px 40px;background:#1e293b;border-radius:16px;padding:22px;font-size:22px;display:flex;justify-content:space-around;align-items:center}
.pill{padding:10px 20px;border-radius:30px;font-weight:700}</style></head><body>
<h1>混杂偏差 <span>Confounding</span> 一图看懂</h1><p class=sub>示例：咖啡 × 寿命，混杂：收入（模拟数据，仅示意）</p>
<div class=g><div class=k><div class=l>朴素比较：每多一杯</div><div class=big style="color:#f87171">+3.0 年</div><div class=bar style="background:#f87171;width:90%"></div><div class=l>未调整收入</div></div>
<div class=k><div class=l>按收入分层后</div><div class=big style="color:#4ade80">≈ +0.1 年</div><div class=bar style="background:#4ade80;width:8%"></div><div class=l>组内几乎无关</div></div>
<div class=k><div class=l>偏差来源</div><div class=big style="color:#facc15">97%</div><div class=bar style="background:#facc15;width:97%"></div><div class=l>来自后门路径</div></div></div>
<div class=flow><span class="pill" style="background:#78350f">☕ 咖啡</span><span style="color:#facc15">⟵</span><span class=pill style="background:#713f12">💰 收入</span><span style="color:#facc15">⟶</span><span class=pill style="background:#14532d">🧓 寿命</span></div>
<p class=sub style="margin-top:18px">结论：关闭后门路径（分层 / 回归调整 / 匹配）之后，才可能接近因果效应。</p></body></html>
