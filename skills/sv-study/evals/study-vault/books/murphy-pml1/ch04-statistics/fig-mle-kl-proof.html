<title>MLE as KL minimization</title></head><body><main id="fig">
<div class="kicker">统计 · 推导分步 · Murphy PML 1 §4.2.2</div><h1>最小化到经验分布的 KL，就是最小化 NLL</h1>
<p class="lead">每一步只做一个变形，右栏写<b>用到了什么</b>；标「补」的是书中省略、我们补上的一步。</p>
<figure class="ve-steps" data-steps="5"><div class="frame" style="font-size:1.15rem">
<style>.pf{display:grid;grid-template-columns:2.2rem minmax(0,1fr) minmax(16rem,24rem);gap:.4rem 1rem;align-items:center}.pf>div{padding:.35rem .5rem;border-radius:4px}.pf .now{background:var(--accent-dim)}.why{font:600 .8rem var(--mono);color:var(--text-dim);text-wrap:balance}.n{font:600 .8rem var(--mono);color:var(--accent)}</style>
<div class="pf">
<span class="n" data-s="1">①</span><div data-s="1 1">$D_{\mathbb{KL}}(p\,\|\,q)=\sum_y p(y)\log p(y)-\sum_y p(y)\log q(y)$</div><span class="why" data-s="1">KL 定义 = 负熵 + 交叉熵（Eq. 4.11）</span>
<span class="n" data-s="2">②</span><div data-s="2 2">$=\sum_y\big[p_{\mathcal D}(y)\log p_{\mathcal D}(y)-p_{\mathcal D}(y)\log q(y)\big]$</div><span class="why" data-s="2">令 $p=p_{\mathcal D}$，$q(y)=p(y\mid\theta)$（Eq. 4.13）</span>
<span class="n" data-s="3">③</span><div data-s="3 3">$=-\mathbb H(p_{\mathcal D})-\frac1N\sum_{n=1}^N\log p(y_n\mid\theta)$</div><span class="why" data-s="3">补：经验分布只在 N 个观测点上有质量，对 $y$ 求和变成对样本取平均（Eq. 4.10）</span>
<span class="n" data-s="4">④</span><div data-s="4 4">$=\text{const}+\tfrac1N\,\mathrm{NLL}(\theta)$</div><span class="why" data-s="4">第一项与 $\theta$ 无关；书中写作 const + NLL（Eq. 4.14–4.15），补：严格说有系数 $1/N$</span>
<span class="n" data-s="5">⑤</span><div data-s="5 5">$\arg\min_\theta D_{\mathbb{KL}}=\arg\min_\theta \mathrm{NLL}(\theta)=\hat\theta_{\rm mle}$</div><span class="why risk" data-s="5">★ 常数和正的系数都不改变 argmin（Eq. 4.7）</span>
</div></div>
<ol class="ve-capsrc"><li>KL 拆成两部分：$p$ 自己的负熵，和 $p$ 对 $q$ 的交叉熵。</li><li>把“数据的分布”换成经验分布，把模型分布记作 $q$。</li><li>经验分布只在观测点上有质量，所以对 $y$ 求和就变成对样本求平均。</li><li>只剩一项和 $\theta$ 有关，正是平均的负对数似然。</li><li>所以让模型分布尽量贴近经验分布，等价于做 MLE。</li></ol>
<figcaption><span class="fign">图 2</span> MLE 的一个理由：它让模型分布在 KL 意义下最接近经验分布；关键是第 ③ 步对经验分布的求和。</figcaption></figure></main>
