<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>概念讲解</title>
<!-- 模板：explainer-page（概念讲解页，VE Paper 风格）。只改下面的 PAGE 数据块。页型：结论式标题 → 直觉图 → 机制 → 边界/small multiples → 要记住的。
     figure.type: 'svg'（手画 SVG 字符串，用 .sh/.e/.hot/.el/.sub/.key 类）| 'cards'（small multiples）| 'dag'（drawDAG spec，自动布局用 layout:'elk'）。
     渲染：../render.sh x.html x.png --full --figures（整页 + 每个 figure 单独截图） -->
<link rel="stylesheet" href="../../../../../sv-figure-explain/kit/vendor/katex.min.css">
<style>
:root{color-scheme:light;--bg:#f7f7f4;--surface:#fff;--border:#e3e3dc;--border-bright:#8e8e8a;--text:#17191c;--text-dim:#575c63;--accent:#2c4cd0;--ok:#1d7443;--warn:#836000;--risk:#b3301d;--info:#1b6a94;--accent-dim:rgb(44 76 208/.14);
--t-label:.75rem;--t-body:1rem;--t-lead:1.25rem;--t-h2:1.625rem;--t-h1:2.6rem;--font:"Atkinson Hyperlegible Next","Noto Sans CJK SC","PingFang SC",sans-serif;--disp:"Newsreader","Noto Serif CJK SC",serif;--mono:"Atkinson Hyperlegible Mono","Noto Sans Mono CJK SC",monospace}
html{font-size:17px}body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--font)}
main{max-width:64rem;margin:0 auto;padding:3rem 1.5rem}
.kicker{font:600 var(--t-label) var(--mono);color:var(--text-dim);letter-spacing:.08em}.kicker:before{content:"";display:inline-block;width:1.5rem;height:2px;background:var(--accent);vertical-align:middle;margin-right:.5rem}
h1{font:500 var(--t-h1)/1.12 var(--disp);margin:.75rem 0}h2{font:500 var(--t-h2)/1.2 var(--disp);margin:4.5rem 0 1rem}
.lead{font-size:var(--t-lead);color:var(--text-dim);max-width:44ch}.lead b{color:var(--text)}
figure{margin:1.5rem 0}.frame{background:var(--bg) radial-gradient(var(--border) 1px,transparent 1px) 0 0/16px 16px;border:1px solid var(--border);border-radius:10px;padding:1.5rem}
figcaption{color:var(--text-dim);margin-top:.75rem}figcaption code{font:600 .8rem var(--mono);color:var(--text)}
svg text{font-family:var(--font);fill:var(--text);font-size:15px}.sh{fill:var(--surface);stroke:var(--border-bright);stroke-width:1.5}.key .sh{fill:var(--accent-dim);stroke:var(--accent);stroke-width:2}
.e{fill:none;stroke:var(--text-dim);stroke-width:1.75;marker-end:url(#ah)}.hot{stroke:var(--risk);stroke-width:2.75;stroke-dasharray:6 5}.el{font:13px var(--mono)!important;fill:var(--text-dim)!important;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.sub{font-size:12px!important;fill:var(--text-dim)!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14.5rem,1fr));gap:1rem}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem}
.chip{font:600 var(--t-label) var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 .4rem}.ok{color:var(--ok)}.risk{color:var(--risk)}.warn{color:var(--warn)}
.card h3{font-size:1rem;margin:.5rem 0 .25rem}.card p{margin:0;color:var(--text-dim);font-size:.9rem}
ol.rem li{margin:.3rem 0}
.note{color:var(--text-dim)}
</style></head><body><main id="page">
<svg width="0" height="0" style="position:absolute"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs></svg>
</main>
<script src="../../../../../sv-figure-explain/kit/vendor/katex.min.js"></script><script src="../../../../../sv-figure-explain/kit/vendor/auto-render.min.js"></script><script src="../../../../../sv-figure-explain/kit/vendor/elk.bundled.js"></script><script src="../../../../../sv-figure-explain/kit/vendor/kit.js"></script>
<script>
window.__READY = false;
// ===== 只改这里 =====
const PAGE = {
 "title": "SDID 讲解",
 "kicker": "因果推断 · 面板政策评估 · 概念讲解",
 "h1": "SDID 只在“像的州”和“像的年份”上做 DID",
 "lead": "DID 平等对待所有对照州和处理前年份；SC 只给对照州加权、没有单位固定效应。SDID <b>两边都加权</b>，再用双向固定效应消掉剩下的常数差（§1，Eq. 1.1–1.3）。",
 "sections": [
  {
   "h2": "",
   "figure": {
    "type": "svg",
    "svg": "<svg viewBox=\"0 40 950 240\" role=\"img\" aria-label=\"SDID 用单位权重和时间权重把双向固定效应回归局部化\">\n<path class=\"e\" d=\"M210 86 H330\"/><path class=\"e\" d=\"M210 236 H330\"/><path class=\"e\" d=\"M500 86 C 560 86, 560 150, 600 150\"/><path class=\"e\" d=\"M500 236 C 560 236, 560 180, 600 180\"/><path class=\"e\" style=\"stroke:var(--accent);stroke-width:2.75\" d=\"M800 165 H850\"/>\n<text class=\"el\" x=\"218\" y=\"70\">单位权重 ω</text><text class=\"el\" x=\"218\" y=\"220\">时间权重 λ</text><text class=\"el\" x=\"512\" y=\"112\">进入</text><text class=\"el\" x=\"520\" y=\"248\">进入</text>\n<g><rect class=\"sh\" x=\"20\" y=\"60\" width=\"190\" height=\"52\" rx=\"6\"/><text x=\"115\" y=\"84\" text-anchor=\"middle\">对照州的处理前走势</text><text class=\"sub\" x=\"115\" y=\"102\" text-anchor=\"middle\">Eq. 2.1，带截距 ω₀ 和正则</text></g>\n<g><rect class=\"sh\" x=\"20\" y=\"210\" width=\"190\" height=\"52\" rx=\"6\"/><text x=\"115\" y=\"234\" text-anchor=\"middle\">对照州的处理前各年</text><text class=\"sub\" x=\"115\" y=\"252\" text-anchor=\"middle\">Eq. 2.3，不带正则</text></g>\n<g><rect class=\"sh\" x=\"330\" y=\"60\" width=\"170\" height=\"52\" rx=\"6\"/><text x=\"415\" y=\"84\" text-anchor=\"middle\">加权后与处理组平行</text><text class=\"sub\" x=\"415\" y=\"102\" text-anchor=\"middle\">不必重合</text></g>\n<g><rect class=\"sh\" x=\"330\" y=\"210\" width=\"170\" height=\"52\" rx=\"6\"/><text x=\"415\" y=\"234\" text-anchor=\"middle\">加权后预测处理后均值</text><text class=\"sub\" x=\"415\" y=\"252\" text-anchor=\"middle\">差一个常数也行</text></g>\n<g class=\"key\"><rect class=\"sh\" x=\"600\" y=\"138\" width=\"200\" height=\"56\" rx=\"6\"/><text x=\"700\" y=\"162\" text-anchor=\"middle\">加权双向固定效应回归</text><text class=\"sub\" x=\"700\" y=\"181\" text-anchor=\"middle\">Eq. 1.1；固定效应吸收常数差</text></g>\n<text x=\"858\" y=\"171\" style=\"font-weight:600\">τ 的估计</text></svg>"
   },
   "caption": "两组权重各管一件事，最后都进入同一个加权回归（Eq. 1.1，Algorithm 1）。"
  },
  {
   "h2": "哪种结构下谁最好（CPS 安慰剂模拟，RMSE）",
   "figure": {
    "type": "cards",
    "cards": [
     {
      "chip": "● 只有固定效应（去掉交互项 M）",
      "cls": "warn",
      "h": "DID 最好",
      "p": "DID 0.014 · SDID 0.016 · SC 0.018"
     },
     {
      "chip": "● 只有交互项（去掉固定效应 F）",
      "cls": "warn",
      "h": "SC 最好",
      "p": "SC 0.023 · SDID 0.028 · DID 0.049"
     },
     {
      "chip": "● 两者都有（baseline）",
      "cls": "ok",
      "h": "SDID 最好",
      "p": "SDID 0.028 · SC 0.037 · DID 0.049"
     }
    ]
   },
   "caption": "数值照抄 Table 2（1000 次模拟，分配按最低工资法）；SDID 不是处处最好，而是在两种结构混合时最稳。"
  }
 ],
 "remember": [
  "单位权重让对照组与处理组<b>平行</b>（允许截距），时间权重挑出能预测处理后的年份；处理后各年权重相等（Eq. 2.3 的约束）。",
  "SDID 没有取消假设：它换成“因子模型 + 分配不依赖噪声 + 因子随时间稳定”这类条件（§3–§4）。",
  "只有固定效应时 DID 略好；只有交互项时 SC 更好；SDID 在两者都有时占优（Table 2）。"
 ]
};
// ===== 以下不用改 =====
(async () => {
  const m = document.getElementById('page'); let n = 0; const esc = t => t;
  m.insertAdjacentHTML('beforeend', `<div class="kicker">${PAGE.kicker}</div><h1>${PAGE.h1}</h1><p class="lead">${PAGE.lead}</p>`);
  for (const sec of PAGE.sections) {
    if (sec.h2) m.insertAdjacentHTML('beforeend', `<h2>${sec.h2}</h2>`);
    const f = sec.figure || {};
    if (f.type === 'cards') {
      m.insertAdjacentHTML('beforeend', `<figure><div class="grid">${f.cards.map(c => `<div class="card"><span class="chip ${c.cls || ''}">${c.chip}</span><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')}</div>${sec.caption ? `<figcaption><code>图 ${++n}</code> ${sec.caption}</figcaption>` : ''}</figure>`);
    } else if (f.type === 'svg' || f.type === 'dag') {
      const id = 'f' + Math.random().toString(36).slice(2);
      m.insertAdjacentHTML('beforeend', `<figure><div class="frame" id="${id}">${f.type === 'svg' ? f.svg : ''}</div><figcaption><code>图 ${++n}</code> ${sec.caption || ''}</figcaption></figure>`);
      if (f.type === 'dag') await drawDAG(f.spec, document.getElementById(id));
    }
    if (sec.note) m.insertAdjacentHTML('beforeend', `<p class="note">${sec.note}</p>`);
  }
  if (PAGE.remember) m.insertAdjacentHTML('beforeend', `<h2>要记住的</h2><ol class="rem">${PAGE.remember.map(r => `<li>${r}</li>`).join('')}</ol>`);
  document.title = PAGE.title;
  renderMathInElement(document.body, { delimiters: [{ left: '$', right: '$', display: false }] });
  window.__READY = true;
})();
</script></body></html>
