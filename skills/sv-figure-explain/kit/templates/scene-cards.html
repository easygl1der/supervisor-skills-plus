<!doctype html><html><head><meta charset="utf-8">
<!-- 场景卡片：讲 motivation。CARDS 是节点，LINKS 是带标注的箭头（按卡片中心连）。数字只能用真实来源或明确标“示意”。 -->
<link rel="stylesheet" href="../vendor/katex.min.css"><link rel="stylesheet" href="../vendor/kit.css"><script src="../vendor/katex.min.js"></script><script src="../vendor/kit.js"></script>
<style>#stage{position:relative;width:820px;height:400px}
.card{position:absolute;width:190px;padding:14px 12px;border-radius:16px;background:#fff;border:2px solid var(--k);box-shadow:0 3px 0 var(--k);text-align:center}
.card .emo{font-size:40px;line-height:1.1}.card .t{display:block;font-weight:700;font-size:18px;margin-top:4px}.card .s{display:block;font-size:13px;color:var(--muted);margin-top:4px}
h2{margin:0 0 8px;font-size:20px} svg{position:absolute;left:0;top:0;width:820px;height:400px;overflow:visible}</style></head><body>
<div id="fig"><h2 class="t" id="title"></h2><div id="stage"><svg id="links"></svg></div><div class="caption" id="cap"></div></div>
<script>
const TITLE='为什么“喝咖啡的人更长寿”不一定是因果？';
const CARDS=[{id:'inc',emo:'💰',t:'收入高',s:'混杂因素',x:315,y:10,k:'var(--c2)'},{id:'cof',emo:'☕',t:'多喝咖啡',s:'处理 $T$',x:20,y:250,k:'var(--c1)'},{id:'age',emo:'🧓',t:'活得更久',s:'结果 $Y$',x:610,y:250,k:'var(--c3)'}];
const LINKS=[{from:'inc',to:'cof',label:'买得起、常喝'},{from:'inc',to:'age',label:'医疗好、压力小'},{from:'cof',to:'age',label:'真的有效？',dashed:true,color:'var(--warn)'}];
const CAPTION='看到的相关 = 真实效应（未知）+ 收入造成的后门路径';
const st=document.getElementById('stage');
CARDS.forEach(c=>{const d=document.createElement('div');d.className='card';d.id=c.id;d.style.left=c.x+'px';d.style.top=c.y+'px';d.style.setProperty('--k',c.k);
 d.innerHTML=`<div class="emo">${c.emo}</div><span class="t">${tex(c.t)}</span><span class="s">${tex(c.s)}</span>`;st.appendChild(d);});
const S=st.getBoundingClientRect();let svg='<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs>';
function edgePt(r,tx,ty){const cx=r.left+r.width/2-S.left,cy=r.top+r.height/2-S.top,dx=tx-cx,dy=ty-cy,k=Math.min(r.width/2/Math.abs(dx||1e-9),r.height/2/Math.abs(dy||1e-9));return[cx+dx*k*1.06,cy+dy*k*1.06];}
LINKS.forEach(l=>{const A=document.getElementById(l.from).getBoundingClientRect(),B=document.getElementById(l.to).getBoundingClientRect();
 const bc=[B.left+B.width/2-S.left,B.top+B.height/2-S.top],ac=[A.left+A.width/2-S.left,A.top+A.height/2-S.top];const p=edgePt(A,...bc),q=edgePt(B,...ac);const col=l.color||'var(--ink)';
 svg+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${col}" stroke-width="2.5" ${l.dashed?'stroke-dasharray="8 6"':''} marker-end="url(#a)"/>`;
 // label beside the line: offset along the normal, away from the stage centre, anchored so text never sits on the stroke
 const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,L=Math.hypot(q[0]-p[0],q[1]-p[1])||1;let nx=-(q[1]-p[1])/L,ny=(q[0]-p[0])/L;
 if(nx*(mx-S.width/2)+ny*(my-S.height/2)<0){nx=-nx;ny=-ny;}
 const lx=mx+nx*14,ly=my+ny*14+(ny>0.3?12:ny<-0.3?-2:5),anc=nx>0.3?'start':nx<-0.3?'end':'middle';
 svg+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="15" fill="${col}">${l.label}</text>`;});
document.getElementById('links').innerHTML=svg;document.getElementById('title').textContent=TITLE;document.getElementById('cap').innerHTML=tex(CAPTION);window.__READY=true;
</script></body></html>
