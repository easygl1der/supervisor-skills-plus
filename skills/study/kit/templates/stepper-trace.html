<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../vendor/katex.min.css"><link rel="stylesheet" href="../vendor/ve/ve.css"><script src="../vendor/katex.min.js"></script><script src="../vendor/auto-render.min.js"></script><script src="../vendor/ve/stepper.js"></script>
<!-- 模板：stepper-trace（stepper，改数据/SVG 即可）。parts 用 data-s="k"（第 k 步出现）或 data-s="0 k"（一直画、第 k 步点亮）；data-only="k" 只在第 k 步出现。说明写在 ol.ve-capsrc 或 window.CAPS。打开时显示全图。渲染：../render.sh x.html x.png --full --steps [--gif] -->
<title>binary search trace</title></head><body><main id="fig">
<div class="kicker">编程 · 代码执行追踪</div><h1>二分查找每轮砍掉一半：8 个数最多 3 轮</h1>
<p class="lead">左边高亮当前执行的行，右边是数组和变量 <b>lo / mid / hi</b> 的实时值。查找目标 23。</p>
<style>.tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.25rem}.code{font:400 .9rem/1.9 var(--mono);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 0;white-space:pre}
.code div{padding:0 1rem}.code .hl{background:var(--accent-dim);box-shadow:inset 3px 0 var(--accent)}.arr{display:flex;gap:6px;margin:1.5rem 0 .5rem}.cell{flex:1;text-align:center;font:600 1rem/2.6rem var(--mono);background:var(--surface);border:1.5px solid var(--border-bright);border-radius:4px;transition:all .4s var(--ease)}
.cell.out{opacity:.25}.cell.mid{border-color:var(--accent);background:var(--accent-dim)}.cell.hit{border-color:var(--ok);background:var(--ok-dim);color:var(--ok)}.idx{display:flex;gap:6px}.idx span{flex:1;text-align:center;font:.75rem var(--mono);color:var(--text-dim)}
.ptr{display:flex;gap:6px;height:1.4rem}.ptr span{flex:1;text-align:center;font:600 .75rem var(--mono);color:var(--accent)}.vars{display:flex;gap:1rem;margin-top:1rem}.vars div{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:.3rem .7rem;font:600 .9rem var(--mono)}</style>
<figure class="ve-steps" data-steps="6"><div class="frame"><div class="tr">
<div class="code" id="code"></div>
<div><div class="idx" id="idx"></div><div class="arr" id="arr"></div><div class="ptr" id="ptr"></div><div class="vars" id="vars"></div></div></div></div>
<figcaption><span class="fign">图 1</span> 执行追踪：每一步 = 一行代码 + 它改变的状态。</figcaption></figure></main>
<script>
const L=['def bsearch(a, t):','    lo, hi = 0, len(a) - 1','    while lo <= hi:','        mid = (lo + hi) // 2','        if a[mid] == t: return mid','        if a[mid] < t: lo = mid + 1','        else:          hi = mid - 1','    return -1'];
const A=[3,8,11,15,23,31,42,57];
const S=[{l:1,lo:0,hi:7,c:'初始化：搜索区间是整个数组 [0, 7]。'},{l:3,lo:0,hi:7,mid:3,c:'mid = 3，a[3] = 15。'},{l:5,lo:4,hi:7,mid:3,c:'15 &lt; 23 → 目标在右半边，<b>lo = 4</b>，左半 4 个数被排除。'},{l:3,lo:4,hi:7,mid:5,c:'mid = 5，a[5] = 31。'},{l:6,lo:4,hi:4,mid:5,c:'31 &gt; 23 → <b>hi = 4</b>，只剩 1 个候选。'},{l:4,lo:4,hi:4,mid:4,hit:1,c:'mid = 4，a[4] = 23 → 找到，返回 4。共 3 轮比较 = ⌈log₂ 8⌉。'}];
window.CAPS=S.map(s=>s.c);
document.getElementById('idx').innerHTML=A.map((_,i)=>`<span>${i}</span>`).join('');
window.onStep=k=>{const s=S[k-1];document.getElementById('code').innerHTML=L.map((t,i)=>`<div class="${i==s.l?'hl':''}">${t.replace(/</g,'&lt;')}</div>`).join('');
 document.getElementById('arr').innerHTML=A.map((v,i)=>`<div class="cell ${i<s.lo||i>s.hi?'out':''} ${i===s.mid?(s.hit?'hit':'mid'):''}">${v}</div>`).join('');
 document.getElementById('ptr').innerHTML=A.map((_,i)=>`<span>${[i===s.lo?'lo':'',i===s.mid?'mid':'',i===s.hi?'hi':''].filter(Boolean).join('/')}</span>`).join('');
 document.getElementById('vars').innerHTML=`<div>lo = ${s.lo}</div><div>mid = ${s.mid??'–'}</div><div>hi = ${s.hi}</div>`;};
</script>
<script>renderMathInElement(document.body,{delimiters:[{left:"$",right:"$",display:false}]});veInit();window.__READY=true</script></body></html>
