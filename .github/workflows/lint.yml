name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install lint dependencies
        run: python -m pip install -r requirements-lint.txt
      - name: Skill structure lint
        run: python scripts/lint_skills.py
      - name: Shared-reference sync check
        run: python scripts/check_shared_sync.py
      - name: Checklist format check
        run: python scripts/check_checklists.py
      - name: Source citation check (archive citations skipped in CI)
        run: python scripts/check_sources.py
